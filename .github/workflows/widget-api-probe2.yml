name: 🔬 Widget API Availability 2

# Продолжение: ищем объявления WidgetFamily / WidgetRenderingMode во всех
# фреймворках SDK и печатаем атрибуты доступности рядом с ними.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: 🔬 Dump availability
    runs-on: macos-26
    steps:
      - name: 🔍 Where are the declarations
        run: |
          DEV=$(xcode-select -p)
          SDK="$DEV/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"
          echo "=== все swiftinterface в SDK ==="
          find "$SDK/System/Library/Frameworks" -name "*.swiftinterface" 2>/dev/null | head -30
          echo ""
          echo "=== где вообще встречается WidgetFamily ==="
          grep -rl "WidgetFamily" "$SDK/System/Library/Frameworks" 2>/dev/null | head -10
          echo ""
          echo "=== где вообще встречается systemExtraLarge ==="
          grep -rl "systemExtraLarge" "$SDK/System/Library/Frameworks" 2>/dev/null | head -10

      - name: 🔍 Dump the enum bodies
        run: |
          DEV=$(xcode-select -p)
          SDK="$DEV/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"
          for F in $(grep -rl "enum WidgetFamily" "$SDK/System/Library/Frameworks" 2>/dev/null | head -3); do
            echo "########## $F ##########"
            # Печатаем 90 строк от объявления enum.
            grep -n -A90 "enum WidgetFamily" "$F" | head -100
            echo ""
          done

      - name: 🔍 Dump WidgetRenderingMode
        run: |
          DEV=$(xcode-select -p)
          SDK="$DEV/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"
          for F in $(grep -rl "enum WidgetRenderingMode" "$SDK/System/Library/Frameworks" 2>/dev/null | head -3); do
            echo "########## $F ##########"
            grep -n -B4 -A40 "enum WidgetRenderingMode" "$F" | head -60
            echo ""
          done