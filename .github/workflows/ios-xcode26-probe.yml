name: 🔬 Kotlin/Native on Xcode 26

# Проверка совместимости: соберётся ли iOS-фреймворк и приложение на
# macos-26 с Xcode 26.6 (SDK iOS 26.5). От этого зависит, можно ли вообще
# использовать systemExtraLargePortrait, объявленный только в этом SDK.
# Временный workflow для аудита.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: 🔬 Build on Xcode 26
    runs-on: macos-26
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: 🔑 Make gradlew executable
        run: chmod +x gradlew

      - name: 📌 Answers about toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "=== active SDK ==="
          xcrun --sdk iphoneos --show-sdk-version || true

      - name: 🌉 Try Kotlin/Native framework link
        run: |
          set +e
          ./gradlew :shared:linkDebugFrameworkIosArm64 --console=plain 2>&1 | tail -40
          echo "GRADLE_EXIT=${PIPESTATUS[0]}"

      - name: 🍏 Try full iOS app build (no codesign)
        run: |
          set +e
          cd iosApp
          xcodebuild -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build275 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tail -60
          echo "XCODEBUILD_EXIT=${PIPESTATUS[0]}"

      - name: 📋 Did the widget still build?
        run: |
          ls iosApp/build275/Build/Products/Release-iphoneos/ 2>/dev/null || echo "(no products)"