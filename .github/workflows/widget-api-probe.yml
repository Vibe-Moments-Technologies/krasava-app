name: 🔬 Widget API Availability

# Печатает ФАКТИЧЕСКИЕ объявления WidgetFamily и WidgetRenderingMode из SDK
# Xcode 26 с атрибутами доступности. Нужно, чтобы не гадать: в предыдущей
# пробе искали только имена, а важны именно @available-атрибуты
# (systemExtraLargePortrait оказался недоступен для iOS).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: 🔬 Dump availability
    runs-on: macos-26
    steps:
      - name: 🔍 WidgetFamily и WidgetRenderingMode
        run: |
          set -e
          DEV=$(xcode-select -p)
          echo "=== $DEV ==="
          SDK="$DEV/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"
          SI=$(find "$SDK/System/Library/Frameworks/SwiftUI.framework" -name "*.swiftinterface" | head -1)
          echo "interface: $SI"

          echo ""
          echo "########## WidgetFamily ##########"
          # Печатаем объявление enum вместе с атрибутами перед ним и внутри.
          awk '/public enum WidgetFamily/,/^}/' "$SI" | head -80

          echo ""
          echo "########## WidgetRenderingMode ##########"
          awk '/public enum WidgetRenderingMode/,/^}/' "$SI" | head -40

          echo ""
          echo "########## systemExtraLarge в контексте ##########"
          grep -n -B3 -A3 "systemExtraLarge" "$SI" | head -60 || true