name: 🔬 iOS SDK Probe 2

# Вторая часть аудита: есть ли у GitHub раннер с более новым Xcode, где
# объявлено семейство systemExtraLargePortrait (iPhone, требуется ТЗ),
# и какие семейства реально доступны на самом новом доступном раннере.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newest-runner:
    name: 🔬 Probe newest runner
    # macos-26 может не существовать; тогда job не запустится — это и есть ответ.
    runs-on: macos-26
    steps:
      - name: 🔍 Xcode and SDK
        run: |
          echo "=== xcodebuild ==="
          xcodebuild -version || true
          echo "=== installed Xcode ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          echo "=== available iPhoneOS SDKs (active) ==="
          DEV=$(xcode-select -p)
          ls "$DEV/Platforms/iPhoneOS.platform/Developer/SDKs" 2>/dev/null || true

      - name: 🔍 WidgetFamily cases in this SDK
        run: |
          DEV=$(xcode-select -p)
          SDKROOT_DIR="$DEV/Platforms/iPhoneOS.platform/Developer/SDKs"
          echo "=== все упоминания systemExtraLarge* ==="
          grep -rho "systemExtraLarge[A-Za-z]*" "$SDKROOT_DIR"/iPhoneOS.sdk/System/Library/Frameworks/SwiftUI.framework/ 2>/dev/null | sort -u || true
          grep -rho "systemExtraLarge[A-Za-z]*" "$SDKROOT_DIR"/iPhoneOS.sdk/System/Library/Frameworks/WidgetKit.framework/ 2>/dev/null | sort -u || true
          echo "=== WidgetFamily enum целиком ==="
          IFACE=$(find "$SDKROOT_DIR"/iPhoneOS.sdk/System/Library/Frameworks/SwiftUI.framework -name "*.swiftinterface" 2>/dev/null | head -1)
          echo "interface: $IFACE"
          grep -h -A 60 "public enum WidgetFamily" "$IFACE" 2>/dev/null | head -80 || true