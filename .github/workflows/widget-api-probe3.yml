name: 🔬 Widget API Availability 3

# Печатает объявления WidgetFamily и WidgetRenderingMode из
# WidgetKit.framework обоих SDK (16.4 и 26.6) вместе с @available-атрибутами.
# Нужно, чтобы точно знать: какие семейства реально доступны на iOS и с какой
# версии доступен widgetRenderingMode.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: 🔬 Dump WidgetKit enums
    runs-on: macos-26
    steps:
      - name: 🔍 WidgetFamily из WidgetKit
        run: |
          DEV=$(xcode-select -p)
          SDK="$DEV/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"
          F="$SDK/System/Library/Frameworks/WidgetKit.framework/Modules/WidgetKit.swiftmodule/arm64e-apple-ios.swiftinterface"
          echo "file: $F"
          echo "########## WidgetFamily ##########"
          grep -n -B4 -A60 "enum WidgetFamily" "$F" | head -90
          echo ""
          echo "########## WidgetRenderingMode ##########"
          grep -n -B6 -A30 "enum WidgetRenderingMode" "$F" | head -60

      - name: 🔍 systemExtraLarge контекст
        run: |
          DEV=$(xcode-select -p)
          SDK="$DEV/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"
          F="$SDK/System/Library/Frameworks/WidgetKit.framework/Modules/WidgetKit.swiftmodule/arm64e-apple-ios.swiftinterface"
          echo "########## все строки с systemExtraLarge ##########"
          grep -n -B4 -A2 "systemExtraLarge" "$F" | head -60
          echo ""
          echo "########## containerBackground ##########"
          grep -n -B3 -A4 "func containerBackground" "$F" | head -40

      - name: 🔍 Проверка компиляцией
        run: |
          # Реальная проверка: собирается ли обращение к семейству и режиму
          # рендеринга на минимальной версии проекта (iOS 15.3).
          mkdir -p /tmp/probe && cd /tmp/probe
          cat > probe.swift <<'SWIFT'
          import SwiftUI
          import WidgetKit

          // 1. Какие семейства видны без @available?
          let a: WidgetFamily = .systemSmall
          let b: WidgetFamily = .systemMedium
          let c: WidgetFamily = .systemLarge
          _ = (a, b, c)

          // 2. systemExtraLargePortrait под @available:
          @available(iOS 26.0, *)
          func extraLarge() -> WidgetFamily { .systemExtraLargePortrait }

          // 3. widgetRenderingMode под @available(iOS 16.0, *)
          @available(iOS 16.0, *)
          struct V: View {
              @Environment(\.widgetRenderingMode) var mode
              var body: some View { Text("\(mode.hashValue)") }
          }
          SWIFT
          xcrun -sdk iphoneos swiftc -target arm64-apple-ios15.3 -typecheck probe.swift 2>&1 | head -40
          echo "EXIT=$?"