kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
# Оба кеша отключены: генерация аксессоров Compose-ресурсов не включает
# новые PNG ни в ключ build-cache, ни в граф configuration-cache, и отдаёт
# старый Res.kt без аксессоров (CI-фейл «Unresolved reference vk_avatar_*»).
org.gradle.configuration-cache=false
org.gradle.caching=false

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Kotlin/Native GC - offload Obj-C deallocations from main thread to background GC thread
kotlin.native.binary.objcDisposeOnMain=false
