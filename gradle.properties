kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# Build-cache отключён: таск генерации аксессоров Compose-ресурсов не включает
# новые PNG в ключ кеша и отдаёт старый Res.kt без аксессоров (CI-фейл
# «Unresolved reference vk_avatar_*» при добавлении иконок).
org.gradle.caching=false

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Kotlin/Native GC - offload Obj-C deallocations from main thread to background GC thread
kotlin.native.binary.objcDisposeOnMain=false
